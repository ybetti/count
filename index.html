    const el = document.getElementById('calc-tile-actions');
    el.innerHTML = '';
    if (this.tiles.length === 0) return;
    if (this.selectedTileIdx < 0 || this.selectedTileIdx >= this.tiles.length) {
      const hint = document.createElement('span');
      hint.className = 'hint-text';
      hint.textContent = '牌をタップして選択';
      el.appendChild(hint);
      return;
    }
    const idx = this.selectedTileIdx;
    const t = this.tiles[idx];
    const group = document.createElement('div');
    group.className = 'action-btn-group';
    // Win tile button
    const winBtn = document.createElement('button');
    winBtn.className = 'calc-tile-action-btn btn-win';
    winBtn.textContent = (this.winTileType === t) ? '和了牌を解除' : '和了牌に設定';
    winBtn.addEventListener('click', () => {
      this.setWinTile(t);
      this.selectedTileIdx = -1;
    });
    group.appendChild(winBtn);
    // Delete button
    const delBtn = document.createElement('button');
    delBtn.className = 'calc-tile-action-btn btn-delete';
    delBtn.textContent = '削除';
    delBtn.addEventListener('click', () => {
      this.removeTile(idx);
    });
    group.appendChild(delBtn);
    el.appendChild(group);
  }

  renderMelds() {
    const row = document.getElementById('calc-melds-row');
    // Remove existing meld groups (keep buttons)
    row.querySelectorAll('.calc-meld-group').forEach(el => el.remove());
    const btns = row.querySelector('.calc-meld-btns');
    for (let i = 0; i < this.melds.length; i++) {
      const m = this.melds[i];
      const group = document.createElement('div');
      group.className = 'calc-meld-group';
      group.title = 'クリックで削除';
      const label = document.createElement('span');
      label.className = 'calc-meld-label';
      label.textContent = m.type === 'pon' ? 'ポン' : 'チー';
      group.appendChild(label);
      for (const t of m.tiles) {
        group.appendChild(createTileEl(t, { sm: true }));
      }
      group.addEventListener('click', () => this.removeMeld(i));
      row.insertBefore(group, btns);
    }
  }

  renderPicker() {
    const used = this.getUsedCounts();
    const picker = document.getElementById('calc-picker');
    picker.querySelectorAll('.tile').forEach(tile => {
      const typeId = Number(tile.dataset.typeId);
      const remaining = 4 - used[typeId];
      // Update badge
      let badge = tile.querySelector('.tile-badge');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'tile-badge';
        tile.appendChild(badge);
      }
      badge.textContent = remaining;
      tile.classList.toggle('disabled', remaining <= 0);
    });
  }

  renderInfo() {
    document.getElementById('calc-tile-count').textContent = this.getTotalTileCount();
    const winDisplay = document.getElementById('calc-win-tile-display');
    if (this.winTileType >= 0) {
      winDisplay.innerHTML = `<span class="set">${tileName(this.winTileType)}</span>`;
    } else {
      winDisplay.textContent = '未選択';
    }
  }

  calculate() {
    const resultEl = document.getElementById('calc-result');
    const innerEl = document.getElementById('calc-result-inner');
    resultEl.classList.add('show');

    // Validation
    if (this.getTotalTileCount() !== 14) {
      innerEl.innerHTML = '<p class="error-msg">手牌を合計14枚にしてください</p>';
      return;
    }
    if (this.winTileType < 0) {
      innerEl.innerHTML = '<p class="error-msg">和了牌をクリックして選択してください</p>';
      return;
    }

    // Build counts for closed hand
    const closedCounts = new Int32Array(34);
    for (const t of this.tiles) closedCounts[t]++;

    // Check win
    const allCounts = new Int32Array(34);
    for (let i = 0; i < 34; i++) allCounts[i] = closedCounts[i];
    for (const m of this.melds) for (const t of m.tiles) allCounts[t]++;

    if (!canWin(closedCounts)) {
      this.showShantenResult(closedCounts, innerEl);
      return;
    }

    // Build decompositions
    const closedForDecomp = new Int32Array(34);
    for (let i = 0; i < 34; i++) closedForDecomp[i] = closedCounts[i];
    const decomps = allDecompositions(closedForDecomp, this.melds.length);
    if (decomps.length === 0) {
      innerEl.innerHTML = '<p class="error-msg">和了形になっていません</p>';
      return;
    }

    // Build a pseudo Hand object for checkAllYaku
    const pseudoHand = new Hand();
    // Create pseudo UIDs for closed tiles
    const uidCounters = new Int32Array(34);
    for (const t of this.tiles) {
      const uid = t * 4 + uidCounters[t];
      uidCounters[t]++;
      pseudoHand.closed.push(uid);
    }
    // Build meld objects
    for (const m of this.melds) {
      const meldUids = [];
      for (const t of m.tiles) {
        const uid = t * 4 + uidCounters[t];
        uidCounters[t]++;
        meldUids.push(uid);
      }
      pseudoHand.melds.push(new Meld(m.type, meldUids, true, 1));
    }

    // Win tile UID — use the first occurrence in closed hand
    const winUid = this.winTileType * 4; // pseudo uid

    const isTsumo = this.options.winMethod === 'tsumo';
    const isMenzen = this.melds.length === 0;
    const seatWind = this.options.seatWind;
    const roundWind = this.options.roundWind;
    const isRiichi = this.options.riichi && isMenzen;

    // Check yaku
    const yakuResult = checkAllYaku(decomps, pseudoHand, winUid, isTsumo,
      seatWind, roundWind, isRiichi, false, allCounts);

    if (yakuResult.han <= 0) {
      innerEl.innerHTML = '<p class="error-msg">役がありません</p>';
      return;
    }

    // Calculate score
    const isDealer = this.options.isDealer;
    const score = calcScore(yakuResult.han, yakuResult.fu, isDealer, isTsumo, 0, 0);

    // Render result
    let html = '<div class="yaku-list">';
    for (const y of yakuResult.yaku) {
      html += `<div class="yaku-item"><span class="yaku-name">${y.name}</span><span class="yaku-han">${y.han}翻</span></div>`;
    }
    html += '</div>';
    html += `<div class="score-label">${score.label}</div>`;
    html += `<div class="score-total">${score.total}点</div>`;
    for (const p of score.payments) {
      html += `<div class="score-detail">${p.label}: ${p.amount}点</div>`;
    }
    innerEl.innerHTML = html;
  }

  showShantenResult(closedCounts, innerEl) {
    const numOpenMelds = this.melds.length;
    const isMenzen = numOpenMelds === 0;

    // For each tile we could discard, compute the shanten of the remaining 13 tiles
    let bestShanten = 99;
    const discardResults = []; // {discardType, shanten, waits}

    // Get unique tile types in hand
    const triedTypes = new Set();
    for (let i = 0; i < this.tiles.length; i++) {
      const dt = this.tiles[i];
      if (triedTypes.has(dt)) continue;
      triedTypes.add(dt);

      // Remove one tile of this type and compute shanten
      const tempCounts = new Int32Array(34);
      for (let j = 0; j < 34; j++) tempCounts[j] = closedCounts[j];
      tempCounts[dt]--;

      const sh = calcShanten13(tempCounts, numOpenMelds);
      if (sh < bestShanten) bestShanten = sh;
      discardResults.push({ discardType: dt, shanten: sh, counts: tempCounts });
    }

    let html = '';

    if (bestShanten === 0) {
      // Tenpai
      html += '<div class="calc-shanten-label tenpai">テンパイ';
      if (isMenzen) html += '<span class="calc-riichi-badge">リーチ可能</span>';
      html += '</div>';

      // Show best discards and their waits
      const bestDiscards = discardResults.filter(d => d.shanten === 0);
      for (const bd of bestDiscards) {
        const tempCounts = new Int32Array(34);
        for (let j = 0; j < 34; j++) tempCounts[j] = closedCounts[j];
        tempCounts[bd.discardType]--;
        const waits = getWaits(tempCounts);
        if (waits.length === 0) continue;

        html += `<div class="calc-discard-info">打 ${tileName(bd.discardType)} → 待ち:</div>`;
        html += '<div class="calc-wait-tiles">';
        for (const w of waits) {
          html += createTileEl(w).outerHTML;
        }
        html += '</div>';
      }
    } else if (bestShanten <= 3) {
      html += `<div class="calc-shanten-label shanten">${bestShanten}シャンテン</div>`;

      // Show acceptance tiles (tiles that reduce shanten)
      const bestDiscards = discardResults.filter(d => d.shanten === bestShanten);

      for (const bd of bestDiscards) {
        const tempCounts = new Int32Array(34);
        for (let j = 0; j < 34; j++) tempCounts[j] = closedCounts[j];
        tempCounts[bd.discardType]--;

        // Find tiles that reduce shanten when drawn
        const accepts = [];
        for (let t = 0; t < 34; t++) {
          if (tempCounts[t] >= 4) continue;
          tempCounts[t]++;
          const newSh = calcShanten13(tempCounts, numOpenMelds);
          if (newSh < bestShanten) accepts.push(t);
          tempCounts[t]--;
        }
        if (accepts.length === 0) continue;

        html += `<div class="calc-discard-info">打 ${tileName(bd.discardType)} → 受入 ${accepts.length}種:</div>`;
        html += '<div class="calc-wait-tiles">';
        for (const a of accepts) {
          html += createTileEl(a).outerHTML;
        }
        html += '</div>';
      }
    } else {
      html += `<div class="calc-shanten-label shanten">${bestShanten}シャンテン</div>`;
      html += '<p style="color:#aaa;font-size:13px;margin-top:8px;">シャンテン数が大きいため受入牌の表示を省略しています</p>';
    }

    innerEl.innerHTML = html;
  }
}

// ============================================================
//  NAVIGATION
// ============================================================
let calculator = null;

function showCalcScreen() {
  document.getElementById('app').style.display = 'none';
  const cs = document.getElementById('calc-screen');
  cs.classList.add('show');
  if (!calculator) {
    calculator = new Calculator();
  } else {
    calculator.clear();
  }
}

function showStart() {
  document.getElementById('calc-screen').classList.remove('show');
  document.getElementById('app').style.display = '';
  document.getElementById('info-bar').style.display = 'none';
  game.showStartScreen();
}

// ============================================================
//  INIT
// ============================================================
let game;

function startGame() {
  document.getElementById('info-bar').style.display = '';
  game = new Game();
  game.run();
}

// Show start screen on load
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('info-bar').style.display = 'none';
  game = new Game();
  game.showStartScreen();
});
</script>
